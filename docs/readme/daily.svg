<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-labelledby="t d">
  <title id="t">ポータルの 1 日</title>
  <desc id="d">朝 7:30 の自動の記録から、朝の確認、日中の実績の入力、会議での巡回表示までの 1 日の流れ。時刻の印が左から右へ動く。</desc>
  <defs><clipPath id="card"><rect width="960" height="250" rx="20"/></clipPath></defs>
  <g clip-path="url(#card)" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
    <rect width="960" height="250" fill="#0f1f3a"/>
    <text x="30" y="36" fill="#ffffff" font-size="19" font-weight="700">ポータルの 1 日</text>
    <!-- 時間の軸 -->
    <rect x="60" y="140" width="840" height="8" rx="4" fill="#2c4a75"/>
    <g fill="#a9c1e3" font-size="12" text-anchor="middle" transform="translate(0 20)">
      <text x="60" y="150">6時</text><text x="200" y="150">8時</text><text x="340" y="150">10時</text><text x="480" y="150">12時</text>
      <text x="620" y="150">14時</text><text x="760" y="150">16時</text><text x="900" y="150">18時</text>
    </g>
    <!-- 出来事（順に明るくなる） -->
    <g text-anchor="middle">
      <g transform="translate(165 112)">
        <animate attributeName="opacity" values=".35;1;1;.35" keyTimes="0;.05;.3;1" dur="10s" repeatCount="indefinite"/>
        <text font-size="26">🤖</text><text y="-34" fill="#fde68a" font-size="13.5" font-weight="700">7:30 自動の記録</text>
        <text y="76" fill="#cfe0f5" font-size="12">全現場の予測を記録</text><text y="93" fill="#cfe0f5" font-size="12">遅れの兆しを判定</text>
      </g>
      <g transform="translate(305 112)">
        <animate attributeName="opacity" values=".35;.35;1;1;.35" keyTimes="0;.18;.23;.5;1" dur="10s" repeatCount="indefinite"/>
        <text font-size="26">☀️</text><text y="-34" fill="#fde68a" font-size="13.5" font-weight="700">朝の確認</text>
        <text y="76" fill="#cfe0f5" font-size="12">兆しのある現場</text><text y="93" fill="#cfe0f5" font-size="12">天気・波を確認</text>
      </g>
      <g transform="translate(550 112)">
        <animate attributeName="opacity" values=".35;.35;1;1;.35" keyTimes="0;.4;.45;.7;1" dur="10s" repeatCount="indefinite"/>
        <text font-size="26">✍️</text><text y="-34" fill="#fde68a" font-size="13.5" font-weight="700">日中：実績の入力</text>
        <text y="76" fill="#cfe0f5" font-size="12">出来高を入れると</text><text y="93" fill="#cfe0f5" font-size="12">予測がすぐ更新</text>
      </g>
      <g transform="translate(790 112)">
        <animate attributeName="opacity" values=".35;.35;1;1;.35" keyTimes="0;.65;.7;.95;1" dur="10s" repeatCount="indefinite"/>
        <text font-size="26">📋</text><text y="-34" fill="#fde68a" font-size="13.5" font-weight="700">会議：巡回表示</text>
        <text y="76" fill="#cfe0f5" font-size="12">遅れの大きい順に</text><text y="93" fill="#cfe0f5" font-size="12">自動で現場を表示</text>
      </g>
    </g>
    <!-- いまの時刻の印 -->
    <g>
      <rect x="-3" y="128" width="6" height="32" rx="3" fill="#fbbf24"/>
      <circle cx="0" cy="144" r="8" fill="#fbbf24" opacity=".35"><animate attributeName="r" values="6;14;6" dur="1.2s" repeatCount="indefinite"/></circle>
      <animateTransform attributeName="transform" type="translate" values="60 0;900 0" dur="10s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
