<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d">
  <title id="t">みらい建設工業 3D現場ポータル</title>
  <desc id="d">港の現場を 3D の地図で表示するポータルのイメージ。波が動き、現場のピンが点滅する。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a33"/><stop offset="1" stop-color="#12345e"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e6fb8"/><stop offset="1" stop-color="#0b3a6b"/>
    </linearGradient>
    <clipPath id="card"><rect width="960" height="300" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="960" height="300" fill="url(#sky)"/>
    <!-- 星（ゆっくり瞬く） -->
    <g fill="#cfe3ff">
      <circle cx="80" cy="40" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="70" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="30" r="1.4"><animate attributeName="opacity" values=".3;1;.3" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="50" r="1.5"><animate attributeName="opacity" values="1;.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
    </g>
    <!-- 地球（経線が回る） -->
    <g transform="translate(860 120)">
      <circle r="58" fill="#1f7a4d"/>
      <path d="M-40-30 q20 -12 38 -2 q14 10 34 2 l8 22 q-24 10 -40 2 q-20 -8 -44 6z" fill="#3fb06f"/>
      <path d="M-30 18 q16 -8 30 0 q16 8 30 0 l4 16 q-18 12 -34 4 q-16 -6 -30 2z" fill="#3fb06f"/>
      <circle r="58" fill="none" stroke="#9fd3ff" stroke-width="2" opacity=".7"/>
      <ellipse rx="22" ry="58" fill="none" stroke="#bfe3ff" stroke-width="1.4" opacity=".7">
        <animate attributeName="rx" values="58;2;58" dur="6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="40" ry="58" fill="none" stroke="#bfe3ff" stroke-width="1" opacity=".45">
        <animate attributeName="rx" values="2;58;2" dur="6s" repeatCount="indefinite"/>
      </ellipse>
      <line x1="-58" y1="0" x2="58" y2="0" stroke="#bfe3ff" stroke-width="1" opacity=".5"/>
    </g>
    <!-- 文字 -->
    <text x="48" y="92" fill="#ffffff" font-size="40" font-weight="700" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">みらい建設工業 3D現場ポータル</text>
    <text x="50" y="132" fill="#bcd6f5" font-size="20" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">港湾・海洋土木の現場を、3D の地図でひと目に。遅れの兆しを、毎朝お知らせ。</text>
    <!-- 岸壁と現場のピン -->
    <rect x="0" y="196" width="960" height="104" fill="url(#sea)"/>
    <path d="M0 196 L300 196 L300 186 L520 186 L520 196 L960 196 L960 210 L0 210z" fill="#8a94a6"/>
    <rect x="330" y="160" width="60" height="26" fill="#c9cfd9"/><rect x="400" y="150" width="46" height="36" fill="#aeb6c3"/>
    <g font-family="'Hiragino Sans','Noto Sans JP','Meiryo',sans-serif" font-size="13" fill="#ffffff">
      <g transform="translate(150 178)">
        <circle r="14" fill="#f59e0b" opacity=".35"><animate attributeName="r" values="6;22;6" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="2.4s" repeatCount="indefinite"/></circle>
        <circle r="7" fill="#f59e0b"/><text x="12" y="-10">浚渫</text>
      </g>
      <g transform="translate(470 172)">
        <circle r="14" fill="#22c55e" opacity=".35"><animate attributeName="r" values="6;22;6" dur="2.4s" begin=".8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="2.4s" begin=".8s" repeatCount="indefinite"/></circle>
        <circle r="7" fill="#22c55e"/><text x="12" y="-10">ふ頭ヤード</text>
      </g>
      <g transform="translate(680 180)">
        <circle r="14" fill="#ef4444" opacity=".35"><animate attributeName="r" values="6;22;6" dur="2.4s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
        <circle r="7" fill="#ef4444"/><text x="12" y="-10">防潮堤（遅れの兆し）</text>
      </g>
    </g>
    <!-- 作業船（行ったり来たり） -->
    <g>
      <path d="M0 0 h56 l-8 12 h-40z" fill="#f8fafc"/><rect x="18" y="-14" width="16" height="14" fill="#f8fafc"/><rect x="38" y="-26" width="4" height="26" fill="#f8fafc"/>
      <animateTransform attributeName="transform" type="translate" values="560 236;800 236;560 236" dur="16s" repeatCount="indefinite"/>
    </g>
    <!-- 波（横に流れる） -->
    <g fill="none" stroke="#9fd3ff" stroke-width="2" opacity=".55">
      <path d="M-120 250 q30 -10 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0">
        <animateTransform attributeName="transform" type="translate" values="0 0;120 0" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M-120 274 q30 -10 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" opacity=".6">
        <animateTransform attributeName="transform" type="translate" values="120 0;0 0" dur="7s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
